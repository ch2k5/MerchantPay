services:
  db:
    image: postgres:16-alpine
    container_name: merchant_pay_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merchant_pay}
      POSTGRES_USER: ${POSTGRES_USER:-merchant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchant_secret_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-merchant_user} -d ${POSTGRES_DB:-merchant_pay}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: merchant_pay_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:-insecure_demo_secret_key_finovia_satim_2026}
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://${POSTGRES_USER:-merchant_user}:${POSTGRES_PASSWORD:-merchant_secret_2026}@db:5432/${POSTGRES_DB:-merchant_pay}
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

volumes:
  postgres_data:
  static_volume:
  media_volume:
